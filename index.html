<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI · Interface Inteligente</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="logo">
                <span class="icon">✦</span>
                <h1>Nexus<span>AI</span></h1>
            </div>
            <nav class="nav-controls">
                <button id="themeToggle" aria-label="Alternar tema">🌙</button>
            </nav>
        </header>

        <main class="main-container">
            <section class="input-area">
                <div class="input-wrapper">
                    <textarea id="userInput" placeholder="Digite seu comando ou pergunta..." rows="3"></textarea>
                    <button id="sendButton" class="btn-primary">
                        <span>Enviar</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    </button>
                </div>
                <div class="quick-actions">
                    <button class="chip" data-prompt="Explique o conceito de IA">🤖 O que é IA?</button>
                    <button class="chip" data-prompt="Crie um poema curto">📝 Poema</button>
                    <button class="chip" data-prompt="Dicas de produtividade">⚡ Produtividade</button>
                </div>
            </section>

            <section class="output-area" id="outputArea">
                <div class="output-placeholder">
                    <span class="placeholder-icon">🧠</span>
                    <p>Aguardando sua interação...</p>
                </div>
                <div id="responseContainer" class="response-container"></div>
            </section>
        </main>

        <footer class="footer">
            <p>Nexus AI · Simulação de interface inteligente</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
